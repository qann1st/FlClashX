name: publish

# Manual re-run of the post-build release steps (AUR publish + Telegram
# announcement) for an existing tag — no rebuild, no signing. Reuses the
# already-published GitHub release (its assets and notes) and either creates
# the AUR package on the first run or updates it in place. Toggle either step
# with the inputs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.9)"
        required: true
        type: string
      package:
        description: "AUR package to create or update"
        type: string
        default: flclashx-elysium-git
      aur:
        description: "Publish to AUR"
        type: boolean
        default: true
      telegram:
        description: "Send Telegram announcement"
        type: boolean
        default: false

jobs:
  aur-publish:
    if: ${{ inputs.aur }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH for AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config << 'SSHEOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          SSHEOF

      - name: Parse release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^([0-9.]+)-pre\.([0-9]+)$ ]]; then
            echo "pkgver=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "pkgrel=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "pkgver=$VERSION" >> "$GITHUB_OUTPUT"
            echo "pkgrel=1" >> "$GITHUB_OUTPUT"
          fi

      # AUR has no API to create a package: the first push of a PKGBUILD does
      # it, so a clone that finds nothing seeds the repository from the
      # template this repo carries.
      - name: Take the AUR repository
        env:
          PKG: ${{ inputs.package }}
        run: |
          if git clone "ssh://aur@aur.archlinux.org/$PKG.git" /tmp/aur-pkg; then
            exit 0
          fi
          rm -rf /tmp/aur-pkg
          git init -b master /tmp/aur-pkg
          git -C /tmp/aur-pkg remote add origin "ssh://aur@aur.archlinux.org/$PKG.git"
          cp "$GITHUB_WORKSPACE/aur/$PKG/PKGBUILD" /tmp/aur-pkg/PKGBUILD

      - name: Download release assets and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p /tmp/aur-assets

          gh release download "$TAG" \
            -p "FlClashX-linux-amd64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY"
          echo "sha_x86=$(sha256sum /tmp/aur-assets/FlClashX-linux-amd64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          if gh release download "$TAG" \
            -p "FlClashX-linux-arm64.deb" \
            -D /tmp/aur-assets \
            -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "sha_arm=$(sha256sum /tmp/aur-assets/FlClashX-linux-arm64.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "has_arm=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_arm=false" >> "$GITHUB_OUTPUT"
          fi

          rm -rf /tmp/aur-assets

      - name: Update PKGBUILD
        working-directory: /tmp/aur-pkg
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
          PKGREL: ${{ steps.release.outputs.pkgrel }}
          TAG: ${{ inputs.tag }}
          SHA_X86: ${{ steps.checksums.outputs.sha_x86 }}
          SHA_ARM: ${{ steps.checksums.outputs.sha_arm }}
          HAS_ARM: ${{ steps.checksums.outputs.has_arm }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sed -i "s|^_tag=.*|_tag=\"${TAG}\"|" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86}')/" PKGBUILD

          if [ "$HAS_ARM" == "true" ]; then
            sed -i "s/^arch=.*/arch=('aarch64' 'x86_64')/" PKGBUILD
            sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM}')/" PKGBUILD
          else
            sed -i "s/^arch=.*/arch=('x86_64')/" PKGBUILD
            sed -i "/^source_aarch64=/d" PKGBUILD
            sed -i "/^sha256sums_aarch64=/d" PKGBUILD
          fi

      - name: Generate .SRCINFO
        working-directory: /tmp/aur-pkg
        run: |
          docker run --rm -v "$(pwd):/pkg" archlinux:base-devel bash -c \
            "useradd -m -u $(id -u) builder && chown -R builder:builder /pkg && su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'"

      - name: Push to AUR
        working-directory: /tmp/aur-pkg
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "qann1st (GitHub Actions)"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "the AUR package already matches $TAG"
            exit 0
          fi
          git commit -m "Update to $TAG"
          git push -u origin master

  notify:
    needs: [aur-publish]
    # Runs even if AUR was skipped/failed, as long as Telegram is requested.
    if: ${{ always() && inputs.telegram }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare commit list
        id: prepare_commits
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Reuse the already-published release notes (same content release.md had).
          gh release view "$TAG" --json body -q .body > release.md
          # The tag commit is the version bump, not a change worth announcing.
          commits=$(head -n 20 release.md | grep "^- " | head -n 9 || true)
          commits_escaped=$(echo "$commits" | jq -Rs .)
          echo "commits=$commits_escaped" >> $GITHUB_OUTPUT

      - name: Send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID_1: ${{ secrets.TELEGRAM_CHANNEL_ID_1 }}
          TELEGRAM_CHANNEL_ID_2: ${{ secrets.TELEGRAM_CHANNEL_ID_2 }}
          TELEGRAM_CHANNEL_ID_3: ${{ secrets.TELEGRAM_CHANNEL_ID_3 }}
          VERSION: ${{ inputs.tag }}
          COMMITS: ${{ fromJSON(steps.prepare_commits.outputs.commits) }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
          IS_STABLE: ${{ !contains(inputs.tag, '-') }}
        run: |
          python3 -m pip install requests --quiet
          python3 .github/scripts/notify_telegram.py
